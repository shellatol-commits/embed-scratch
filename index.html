<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Scratch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .embed-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .embed-btn {
            position: relative;
        }

        .embed-btn button {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .embed-btn button:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .embed-btn button:active {
            transform: translateY(0);
        }

        .menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-top: none;
            border-radius: 0 0 8px 8px;
            overflow: hidden;
            display: none;
            min-width: 200px;
            z-index: 1000;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .embed-btn.active .menu {
            display: block;
        }

        .menu-item {
            padding: 12px 16px;
            color: #333;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            background-color: #f8f9ff;
            color: #667eea;
        }

        .menu-item:active {
            background-color: #f0f2ff;
        }

        .icon {
            font-size: 18px;
        }

        @media (max-width: 480px) {
            .embed-buttons {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Embed Scratch</h1>
        <p class="subtitle">Embed Scratch projects into your website with just a few clicks.</p>
        
        <div class="embed-buttons">
            <div class="embed-btn">
                <button onclick="toggleMenu(this)">
                    <span class="icon">📂</span>
                    <span>Open</span>
                </button>
                <div class="menu">
                    <div class="menu-item" onclick="handleAction('open-project')">Open Project</div>
                    <div class="menu-item" onclick="handleAction('open-file')">Open File</div>
                </div>
            </div>

            <div class="embed-btn">
                <button onclick="toggleMenu(this)">
                    <span class="icon">🔗</span>
                    <span>Put in your Site</span>
                </button>
                <div class="menu">
                    <div class="menu-item" onclick="handleAction('generate-embed')">Generate Embed Code</div>
                    <div class="menu-item" onclick="handleAction('copy-embed')">Copy to Clipboard</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu(button) {
            const embedBtn = button.parentElement;
            const isActive = embedBtn.classList.contains('active');
            
            // Close all other menus
            document.querySelectorAll('.embed-btn.active').forEach(btn => {
                if (btn !== embedBtn) {
                    btn.classList.remove('active');
                }
            });
            
            // Toggle current menu
            embedBtn.classList.toggle('active');
        }

        function handleAction(action) {
            console.log('Action triggered:', action);
            
            switch(action) {
                case 'open-project':
                    alert('Open Project - Feature coming soon!');
                    break;
                case 'open-file':
                    alert('Open File - Feature coming soon!');
                    break;
                case 'generate-embed':
                    alert('Generate Embed Code - Feature coming soon!');
                    break;
                case 'copy-embed':
                    alert('Copy to Clipboard - Feature coming soon!');
                    break;
                default:
                    console.log('Unknown action');
            }
        }

        // Close menus when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.embed-btn')) {
                document.querySelectorAll('.embed-btn.active').forEach(btn => {
                    btn.classList.remove('active');
                });
            }
        });
    </script>
</body>
</html>
