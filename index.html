<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Scratch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .input-section {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 2px solid #e8ebff;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"],
        input[type="checkbox"] {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input[type="text"] {
            flex: 1;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-hint {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        .options-section {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e8ebff;
            margin-bottom: 15px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .option-item:last-child {
            margin-bottom: 0;
        }

        .option-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .option-item label {
            cursor: pointer;
            font-size: 14px;
            color: #333;
            flex: 1;
        }

        .embed-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .embed-btn {
            position: relative;
        }

        .embed-btn button {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .embed-btn button:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .embed-btn button:active {
            transform: translateY(0);
        }

        .menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-top: none;
            border-radius: 0 0 8px 8px;
            overflow: hidden;
            display: none;
            min-width: 200px;
            z-index: 1000;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .embed-btn.active .menu {
            display: block;
        }

        .menu-item {
            padding: 12px 16px;
            color: #333;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            background-color: #f8f9ff;
            color: #667eea;
        }

        .menu-item:active {
            background-color: #f0f2ff;
        }

        .icon {
            font-size: 18px;
        }

        .output-section {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #e8ebff;
            display: none;
            margin-top: 25px;
        }

        .output-section.active {
            display: block;
        }

        .output-title {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .output-box {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            word-break: break-all;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            color: #333;
            margin-bottom: 12px;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .copy-btn {
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .copy-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .success-message {
            color: #28a745;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .preview-section {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            margin-top: 12px;
            text-align: center;
        }

        .preview-section p {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
        }

        .preview-section iframe {
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 12px 16px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 14px;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 480px) {
            .embed-buttons {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .input-group {
                flex-direction: column;
            }

            .tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Embed Scratch</h1>
        <p class="subtitle">Generate Forkphorus embeds for Scratch projects.</p>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('forkphorus')">Forkphorus</button>
        </div>

        <!-- Forkphorus Tab -->
        <div class="tab-content active" id="forkphorus-tab">
            <div class="input-section">
                <input type="text" id="projectInput" placeholder="Enter Scratch project ID (e.g., 12345678)" />
                <p class="input-hint">💡 Get the project ID from the URL: scratch.mit.edu/projects/PROJECT_ID</p>
            </div>

            <div class="options-section">
                <div class="option-item">
                    <input type="checkbox" id="autoStart" checked>
                    <label for="autoStart">Auto-start project</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="darkMode">
                    <label for="darkMode">Dark mode (light-content disabled)</label>
                </div>
            </div>
            
            <div class="embed-buttons">
                <div class="embed-btn">
                    <button onclick="toggleMenu(this)">
                        <span class="icon">📂</span>
                        <span>Open</span>
                    </button>
                    <div class="menu">
                        <div class="menu-item" onclick="openForkphorus()">Open in Forkphorus</div>
                        <div class="menu-item" onclick="openScratch()">Open in Scratch</div>
                    </div>
                </div>

                <div class="embed-btn">
                    <button onclick="toggleMenu(this)">
                        <span class="icon">🔗</span>
                        <span>Put in your Site</span>
                    </button>
                    <div class="menu">
                        <div class="menu-item" onclick="generateIframe()">Generate Iframe</div>
                        <div class="menu-item" onclick="generateEmbed()">Generate Embed Link</div>
                    </div>
                </div>
            </div>

            <div class="output-section" id="outputSection">
                <div class="output-title" id="outputTitle">Embed Code</div>
                <div class="output-box" id="outputBox"></div>
                <button class="copy-btn" onclick="copyToClipboard()">📋 Copy to Clipboard</button>
                <div class="success-message" id="successMessage">✓ Copied to clipboard!</div>
                <div class="preview-section" id="previewSection" style="display:none;">
                    <p>Preview:</p>
                    <div id="previewContainer"></div>
                </div>
            </div>
        </div>

        
            </div>
        </div>
    </div>

    <script>
        // Forkphorus variables
        const projectInput = document.getElementById('projectInput');
        const autoStart = document.getElementById('autoStart');
        const darkMode = document.getElementById('darkMode');
        const outputSection = document.getElementById('outputSection');
        const outputBox = document.getElementById('outputBox');
        const outputTitle = document.getElementById('outputTitle');
        const successMessage = document.getElementById('successMessage');
        const previewSection = document.getElementById('previewSection');
        const previewContainer = document.getElementById('previewContainer');

        // Embed Scratch variables
        const embedProjectInput = document.getElementById('embedProjectInput');
        const embedAutoStart = document.getElementById('embedAutoStart');
        const embedDarkMode = document.getElementById('embedDarkMode');
        const outputSectionEmbed = document.getElementById('outputSectionEmbed');
        const outputBoxEmbed = document.getElementById('outputBoxEmbed');
        const outputTitleEmbed = document.getElementById('outputTitleEmbed');
        const successMessageEmbed = document.getElementById('successMessageEmbed');
        const previewSectionEmbed = document.getElementById('previewSectionEmbed');
        const previewContainerEmbed = document.getElementById('previewContainerEmbed');

        // Get base URL for Embed Scratch
        function getEmbedScratchBaseUrl() {
            return window.location.origin + window.location.pathname.replace('index.html', '');
        }

        function switchTab(tab) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            // Show selected tab
            document.getElementById(tab + '-tab').classList.add('active');
            event.target.classList.add('active');
        }

        // Forkphorus functions
        function getProjectId() {
            const id = projectInput.value.trim();
            if (!id) {
                alert('Please enter a Scratch project ID');
                return null;
            }
            if (isNaN(id)) {
                alert('Project ID must be a number');
                return null;
            }
            return id;
        }

        function getEmbedUrl(projectId) {
            const autoStartParam = autoStart.checked ? 'true' : 'false';
            const lightContentParam = darkMode.checked ? 'false' : 'true';
            return `https://forkphorus.github.io/embed.html?id=${projectId}&auto-start=${autoStartParam}&light-content=${lightContentParam}`;
        }

        function toggleMenu(button) {
            const embedBtn = button.parentElement;
            const isActive = embedBtn.classList.contains('active');
            
            // Close all other menus
            document.querySelectorAll('.embed-btn.active').forEach(btn => {
                if (btn !== embedBtn) {
                    btn.classList.remove('active');
                }
            });
            
            // Toggle current menu
            embedBtn.classList.toggle('active');
        }

        function openForkphorus() {
            const projectId = getProjectId();
            if (projectId) {
                window.open(`https://forkphorus.github.io/?id=${projectId}`, '_blank');
            }
            closeMenus();
        }

        function openScratch() {
            const projectId = getProjectId();
            if (projectId) {
                window.open(`https://scratch.mit.edu/projects/${projectId}`, '_blank');
            }
            closeMenus();
        }

        function generateIframe() {
            const projectId = getProjectId();
            if (projectId) {
                const embedUrl = getEmbedUrl(projectId);
                const iframeCode = `<iframe src="${embedUrl}" width="482" height="393" allowfullscreen="true" allowtransparency="true" style="border:none;"></iframe>`;
                displayOutput('Iframe Code', iframeCode, embedUrl, false);
            }
            closeMenus();
        }

        function generateEmbed() {
            const projectId = getProjectId();
            if (projectId) {
                const embedUrl = getEmbedUrl(projectId);
                displayOutput('Embed Link', embedUrl, embedUrl, false);
            }
            closeMenus();
        }

        function displayOutput(title, content, embedUrl, isEmbedScratch) {
            if (isEmbedScratch) {
                outputTitleEmbed.textContent = title;
                outputBoxEmbed.textContent = content;
                outputSectionEmbed.classList.add('active');
                successMessageEmbed.classList.remove('show');

                if (title === 'Iframe Code') {
                    previewSectionEmbed.style.display = 'block';
                    previewContainerEmbed.innerHTML = `<iframe src="${embedUrl}" width="482" height="393" allowfullscreen="true" allowtransparency="true" style="border:none;"></iframe>`;
                } else {
                    previewSectionEmbed.style.display = 'none';
                }
            } else {
                outputTitle.textContent = title;
                outputBox.textContent = content;
                outputSection.classList.add('active');
                successMessage.classList.remove('show');

                if (title === 'Iframe Code') {
                    previewSection.style.display = 'block';
                    previewContainer.innerHTML = `<iframe src="${embedUrl}" width="482" height="393" allowfullscreen="true" allowtransparency="true" style="border:none;"></iframe>`;
                } else {
                    previewSection.style.display = 'none';
                }
            }
        }

        function copyToClipboard() {
            const text = outputBox.textContent;
            navigator.clipboard.writeText(text).then(() => {
                successMessage.classList.add('show');
                setTimeout(() => {
                    successMessage.classList.remove('show');
                }, 2000);
            }).catch(() => {
                alert('Failed to copy to clipboard');
            });
        }

        // Embed Scratch functions
        function getEmbedProjectId() {
            const id = embedProjectInput.value.trim();
            if (!id) {
                alert('Please enter a Scratch project ID');
                return null;
            }
            if (isNaN(id)) {
                alert('Project ID must be a number');
                return null;
            }
            return id;
        }

        function getEmbedScratchUrl(projectId) {
            const autoStartParam = embedAutoStart.checked ? 'true' : 'false';
            const lightContentParam = embedDarkMode.checked ? 'true' : 'false';
            const baseUrl = getEmbedScratchBaseUrl();
            return `${baseUrl}loader.html#${projectId}?auto-start=${autoStartParam}&light-content=${lightContentParam}`;
        }

        function openEmbedScratch() {
            const projectId = getEmbedProjectId();
            if (projectId) {
                window.open(getEmbedScratchUrl(projectId), '_blank');
            }
            closeMenus();
        }

        function openScratchFromEmbed() {
            const projectId = getEmbedProjectId();
            if (projectId) {
                window.open(`https://scratch.mit.edu/projects/${projectId}`, '_blank');
            }
            closeMenus();
        }

        function generateEmbedScratchIframe() {
            const projectId = getEmbedProjectId();
            if (projectId) {
                const embedUrl = getEmbedScratchUrl(projectId);
                const iframeCode = `<iframe src="${embedUrl}" width="482" height="393" allowfullscreen="true" allowtransparency="true" style="border:none;"></iframe>`;
                displayOutput('Iframe Code', iframeCode, embedUrl, true);
            }
            closeMenus();
        }

        function generateEmbedScratchLink() {
            const projectId = getEmbedProjectId();
            if (projectId) {
                const embedUrl = getEmbedScratchUrl(projectId);
                displayOutput('Embed Link', embedUrl, embedUrl, true);
            }
            closeMenus();
        }

        function copyToClipboardEmbed() {
            const text = outputBoxEmbed.textContent;
            navigator.clipboard.writeText(text).then(() => {
                successMessageEmbed.classList.add('show');
                setTimeout(() => {
                    successMessageEmbed.classList.remove('show');
                }, 2000);
            }).catch(() => {
                alert('Failed to copy to clipboard');
            });
        }

        function closeMenus() {
            document.querySelectorAll('.embed-btn.active').forEach(btn => {
                btn.classList.remove('active');
            });
        }

        // Close menus when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.embed-btn')) {
                closeMenus();
            }
        });

        // Allow Enter key in both input fields
        projectInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                openForkphorus();
            }
        });

        embedProjectInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                openEmbedScratch();
            }
        });
    </script>
</body>
</html>
